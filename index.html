    sync();upd();busy=false},300)}

async function initCloud(){try{if(!window.claude)return;const db=await claude.use("db"),us=await claude.use("user");if(!db||!us)return;const id=await us.id();if(!id)return;CL=db.doc("data/users/"+id+"/classes");const r=await CL.get();if(r.exists)Object.assign(LIB,JSON.parse(r.data().lib||"{}"));try{localStorage.setItem("pk_lib",JSON.stringify(LIB))}catch(e){}setST("Synced to your Claude account");if(CFG.auto!==false&&CFG.cls&&LIB[CFG.cls])applyC(CFG.cls);renderLib();if($("#s0").classList.contains("on")&&!$("#set"))home();if(Object.keys(LIB).length)pushCloud()}catch(e){}}
/* ---------- foul: deduct points with effects ---------- */

function foOpen(){if(!TEAMS.length||$("#foPick")||$("#foFx"))return;beep(600,.06,"triangle");const p=document.createElement("div");p.className="modal on";p.id="foPick";p.style.zIndex=30;const many=TEAMS.length>6;
  p.innerHTML=`<div class="card focard"><div class="fohd">${WARN(44)}<h2>FOUL!</h2>${WARN(44)}</div><p class="fosub">Who broke the rules? Tap a ${many?"student":"team"} to deduct points straight away.</p><div class="foamt"><span>Deduct</span>${[1,2,3,5].map(a=>`<button class="btn ${a==foAmt?"on":""}" onclick="foAmtSet(${a})">${a}</button>`).join("")}<span>points</span></div><div class="fogrid ${many?"many":""}">${TEAMS.map((t,i)=>`<button class="fot" style="--gc:${t.c}" onclick="foApply(${i})"><small>${t.e} ${esc(t.n)}</small><b>${t.pts}</b><span class="fom">− <i class="foa">${foAmt}</i></span></button>`).join("")}</div><button class="btn" onclick="foKill()">Cancel</button></div>`;
  $("#stage").appendChild(p)}
function foAmtSet(a){foAmt=a;document.querySelectorAll(".foamt .btn").forEach(b=>b.classList.toggle("on",+b.textContent==a));document.querySelectorAll(".foa").forEach(e=>e.textContent=a)}
function foSnd(a,iv){try{au=au||new(window.AudioContext||window.webkitAudioContext)();if(au.state=="suspended")au.resume();const ac=au,t=ac.currentTime+.02;
  const tone=(st,f1,f2,d,ty,v,lp)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,st);if(f2!=f1)o.frequency.exponentialRampToValueAtTime(f2,st+d);let n=o;if(lp){const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=lp;o.connect(f);n=f}
   g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(v,st+.02);g.gain.setValueAtTime(v,st+d*.7);g.gain.exponentialRampToValueAtTime(.0001,st+d);n.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+d+.03)};
  tone(t,440,440,.16,"square",.07);tone(t+.2,440,440,.16,"square",.07);
  [[.55,311],[.95,293],[1.35,277]].forEach(([d,f])=>tone(t+d,f,f*.97,.36,"sawtooth",.09,1100));tone(t+1.75,261,185,.95,"sawtooth",.1,1100);
  for(let k=0;k<a;k++)tone(t+1.5+k*iv,1500-k*110,950-k*70,.18,"triangle",.09)}catch(e){}}
function foApply(i){const t=TEAMS[i];if(!t)return;const a=foAmt,old=t.pts,eff=Math.min(a,old);t.pts=old-eff;upd();const pk=$("#foPick");if(pk)pk.remove();
  const iv=a<=3?.5:.35,end=1.5+a*iv+1.9,f=document.createElement("div");f.className="fofx";f.id="foFx";f.dataset.at=Date.now();f.setAttribute("role","alert");
  f.innerHTML=`<div class="fotape a"></div><div class="fotape b"></div><div class="fowrap"><div class="fosign">${WARN(140)}</div><div class="fotit">${"FOUL!".split("").map((c,k)=>`<span style="animation-delay:${(.45+k*.09).toFixed(2)}s">${c}</span>`).join("")}</div><div class="foplate" id="foPl" style="--gc:${t.c}"><small>${t.e} ${esc(t.n)}</small><div class="fosc"><b id="foN">${old}</b></div><div class="fomin">− ${a} point${a>1?"s":""}</div></div><div class="fomsg">Fair play! Quiet voices and eyes on the board.</div></div>`;
  $("#stage").appendChild(f);foSnd(a,iv);
  for(let k=1;k<=eff;k++)foT.push(setTimeout(()=>{const n=$("#foN"),pl=$("#foPl");if(!n)return;n.textContent=old-k;n.classList.remove("tick");void n.offsetWidth;n.classList.add("tick");const c=document.createElement("i");c.className="fochip";c.textContent="-1";c.style.setProperty("--dx",R(-230,230)+"px");c.style.setProperty("--rt",R(-540,540)+"deg");pl.appendChild(c);foT.push(setTimeout(()=>c.remove(),1500))},(1.5+(k-1)*iv)*1000));
  foT.push(setTimeout(foKill,end*1000))}
document.addEventListener("click",e=>{const f=$("#foFx");if(f&&f.contains(e.target)&&Date.now()-(+f.dataset.at||0)>1500)foKill()});
const SKY=[["#ffb347","#ffe9a8"],["#7ed4ff","#d6f3ff"],["#9be1ff","#e8fbff"],["#6ec6ff","#c9f0ff"],["#8fd3ff","#f0fbff"],["#c3a6ff","#ffd9f0"]],HZ=["🔺 🐪 🔺","🌾 🏛️ 🌾","🌴 🏺 🌴","⛵ 🌊 🌴","🌳 🏘️ 🌳","🌿 🥚 🦕"];

const POW={s:["THUD!","SCOOP!","DIG!"],p:["CLANG!","BAM!","CRACK!"],b:["SWISH!","SWEEP!","FLUFF!"],L:["LAYER CLEARED!"],W:["OOPS!","NOPE!"]},PC={s:"#7dff6a",p:"#ff9a3c",b:"#5ad7ff",L:"#ffd23f",W:"#ff4f8b"};
function pow(k){const e=document.createElement("b");e.className="pow";e.textContent=POW[k][Math.floor(R(0,POW[k].length))];e.style.left="calc(var(--px,50%) + "+R(-5,5)+"%)";e.style.color=PC[k];e.style.setProperty("--rt",R(-14,14)+"deg");sc.appendChild(e);const g=document.createElement("i");g.className="ring";g.style.left="var(--px,50%)";sc.appendChild(g);setTimeout(()=>{e.remove();g.remove()},900)}
let mg,fg,song=1,stp=0,nxt=0,mt=0,fxOn=true;
function A(){au=au||new(window.AudioContext||window.webkitAudioContext)();if(!mg){mg=au.createGain();mg.gain.value=.3;mg.connect(au.destination);fg=au.createGain();fg.gain.value=.9;fg.connect(au.destination)}if(au.state=="suspended")au.resume();return au}
function osc(t,f,d,ty,v,dest,f2){const o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,fr,dest,at){const n=Math.floor(au.sampleRate*d),b=au.createBuffer(1,n,au.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const sr=au.createBufferSource(),f=au.createBiquadFilter(),g=au.createGain();sr.buffer=b;f.type="bandpass";f.frequency.value=fr;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+(at||.01));g.gain.exponentialRampToValueAtTime(.001,t+d);sr.connect(f);f.connect(g);g.connect(dest);sr.start(t)}
function fx(n){if(!fxOn)return;try{A();const t=au.currentTime;
 if(n=="shovel"){osc(t,140,.14,"sine",.9,fg,55);noise(t,.18,.5,900,fg,.01);noise(t+.05,.25,.25,300,fg,.05)}
 if(n=="pick"){osc(t,1500,.35,"triangle",.3,fg,900);osc(t,2300,.25,"square",.08,fg);noise(t,.07,.5,4000,fg,.003);osc(t+.02,100,.2,"sine",.8,fg,45)}
 if(n=="brush"){noise(t,.28,.4,4500,fg,.08);noise(t+.18,.28,.35,3800,fg,.08)}
 if(n=="dirt")for(let i=0;i<5;i++)noise(t+i*.07,.06,.25,500+i*120,fg,.004);
 if(n=="layer")[392,523,659,784].forEach((f,i)=>osc(t+i*.08,f,.25,"triangle",.22,fg));
 if(n=="wrong"){osc(t,130,.35,"sawtooth",.35,fg,70);osc(t+.1,100,.3,"square",.2,fg,60)}
 if(n=="crack"){noise(t,.25,.7,6000,fg,.002);noise(t+.06,.2,.5,2500,fg,.002);osc(t,90,.4,"sine",.7,fg,40)}
 if(n=="reveal"){[784,988,1175,1568,1976].forEach((f,i)=>osc(t+i*.07,f,.35,"sine",.18,fg));noise(t,.9,.15,8000,fg,.4)}
 if(n=="glove"){noise(t,.15,.4,2500,fg,.03);osc(t+.1,500,.25,"triangle",.25,fg,900)}
 if(n=="collect"){[523,659,784,1047,1319].forEach((f,i)=>osc(t+i*.09,f,.35,"sawtooth",.16,fg));noise(t,1.6,.4,900,fg,.3)}
 if(n=="win")[659,784,988,1319].forEach((f,i)=>osc(t+i*.1,f,.3,"triangle",.22,fg));
 if(n=="spot"){osc(t,500,.1,"triangle",.25,fg,800);osc(t+.1,750,.12,"triangle",.25,fg)}
 if(n=="walk")for(let i=0;i<6;i++){osc(t+i*.14,85,.07,"sine",.5,fg,55);noise(t+i*.14,.04,.2,500,fg,.002)}
 if(n=="bird")[0,.12,.24].forEach(d=>osc(t+d,2600,.09,"sine",.07,fg,3600));
 if(n=="whistle"){const o=au.createOscillator(),l=au.createOscillator(),lg=au.createGain(),g=au.createGain();o.frequency.value=2800;l.frequency.value=40;lg.gain.value=120;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(.3,t+.4);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(fg);o.start(t);l.start(t);o.stop(t+.55);l.stop(t+.55)}
}catch(e){}}
const mf=m=>440*2**((m-69)/12);

 if(sg.k.includes(i))osc(t,150,.18,"sine",.9,mg,45);if(sg.c.includes(i))noise(t,.12,.5,1800,mg);if(sg.h.includes(i))noise(t,.04,.12,7000,mg);
